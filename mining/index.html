<body>
     <div id="custom-cursor" class="custom-cursor-highlight"></div>
<script>
      document.addEventListener('DOMContentLoaded', () => {
    const cursor = document.querySelector('.custom-cursor-highlight');
    
    // Safety check in case the element does not exist on the page
    if (!cursor) return;

    // 1. Track mouse movement
    window.addEventListener('mousemove', (e) => {
        // Use clientX and clientY because your CSS uses position: fixed
        cursor.style.left = `${e.clientX}px`;
        cursor.style.top = `${e.clientY}px`;
    });

    // 2. Select elements that trigger the grow effect
    const interactiveElements = document.querySelectorAll('a, button, input, select, textarea, [role="button"]');

    // 3. Add hover listeners to trigger the transition
    interactiveElements.forEach(element => {
        element.addEventListener('mouseenter', () => {
            cursor.classList.add('grow');
        });
        
        element.addEventListener('mouseleave', () => {
            cursor.classList.remove('grow');
        });
    });
});

</script>
